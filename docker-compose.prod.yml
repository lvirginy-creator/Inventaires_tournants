services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-inventaire}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inventaire}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_ADMIN_ACCESS_MINUTES: 60
      JWT_ADMIN_REFRESH_HOURS: 8
      JWT_TABLETTE_HOURS: 12
      TOKEN_APPAIRAGE_HOURS: 24
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: INFO
      ENVIRONMENT: production
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Inventaire G2C}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend

  frontend-tablette:
    build:
      context: ./frontend-tablette
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - backend

volumes:
  pgdata_prod:
