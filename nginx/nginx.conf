worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/json
        application/javascript text/xml application/xml
        image/svg+xml;

    # ── Upstreams ──────────────────────────────────────────────────────────────

    upstream backend {
        server backend:8000;
    }

    upstream frontend_admin {
        server frontend-admin:80;
    }

    upstream frontend_tablette {
        server frontend-tablette:80;
    }

    # ── Redirection HTTP → HTTPS ───────────────────────────────────────────────

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Interface Tablette (domaine principal) ─────────────────────────────────
    # Remplacer tablette.g2c.example.com par votre domaine réel

    server {
        listen 443 ssl;
        server_name tablette.g2c.example.com;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        # API backend (proxy transparent)
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://backend/health;
        }

        # SPA tablette — fallback index.html géré par le conteneur frontend-tablette
        location / {
            proxy_pass http://frontend_tablette;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # ── Interface Admin ────────────────────────────────────────────────────────
    # Remplacer admin.g2c.example.com par votre domaine réel

    server {
        listen 443 ssl;
        server_name admin.g2c.example.com;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        # API backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://backend/redoc;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://backend/health;
        }

        # SPA admin
        location / {
            proxy_pass http://frontend_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
