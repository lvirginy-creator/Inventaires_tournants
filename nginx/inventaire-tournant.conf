# ── Inventaire Tournant — vhost nginx ─────────────────────────────────────────
# Copier dans /etc/nginx/sites-available/inventaire-tournant.conf
# puis : ln -s /etc/nginx/sites-available/inventaire-tournant.conf /etc/nginx/sites-enabled/
#
# Remplacer les deux server_name par vos domaines réels, puis :
#   certbot --nginx -d tablette.votre-domaine.com -d admin.votre-domaine.com
# ──────────────────────────────────────────────────────────────────────────────

# ── Interface Tablette ─────────────────────────────────────────────────────────

server {
    listen 80;
    server_name tablette.votre-domaine.com;

    client_max_body_size 50M;

    # API backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # SPA tablette
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Interface Admin ────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name admin.votre-domaine.com;

    client_max_body_size 50M;

    # API backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # SPA admin
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
